name: Android Play Store

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Base version for develop build"
        required: true
        default: "0.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Play Store

    # Bei manuellem Start nur develop erlauben
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            RELEASE_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME="${{ inputs.version }}-dev.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="${VERSION_NAME}"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

          echo "Version: $VERSION_NAME"
          echo "Build: $GITHUB_RUN_NUMBER"

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing or empty." >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          if [[ ! -s "$RUNNER_TEMP/release.jks" ]]; then
            echo "Decoded Android keystore is missing or empty." >&2
            exit 1
          fi

          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Validate Android signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "One or more Android signing secrets are missing: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool -certreq \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/android-signing-cert-request.pem" \
            >/dev/null
          
      - name: Export lib info
        run: |
          ./gradlew :shared:exportLibraryDefinitions

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:bundleRelease \
            -Pandroid.version="$VERSION_NAME" \
            -Pandroid.versionCode="$VERSION_CODE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaceview-${{ env.VERSION_NAME }}
          path: androidApp/build/outputs/bundle/release/*.aab

      - name: Upload release tag to Google Play
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.jpromi.spaceview
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
          releaseName: ${{ env.RELEASE_NAME }}

      - name: Upload develop build to Google Play
        if: github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.jpromi.spaceview
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
          releaseName: ${{ env.RELEASE_NAME }}
